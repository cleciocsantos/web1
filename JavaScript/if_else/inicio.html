<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Inicial</title>
</head>
<body>
    <label for="hora">Que horas são:</label>
    <input type="text" id="hora">
    <button onclick="saudar()">Enivar</button>
    <p id="saudacao"></p>
    <script>
        function saudar(){
            let hora = document.getElementById('hora').value;
            let paragrafo = document.getElementById('saudacao');
            if(hora <= 12 || hora > 16){
                paragrafo.innerHTML = "Horário de descanso!";
            }
            else if(hora == 15){
                paragrafo.innerHTML = "Horário do vôlei!";
            }
            else{
                paragrafo.innerHTML = "Horário de aula!";
            }
        }
    </script>    
</body>
</html>
