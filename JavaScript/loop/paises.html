<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crescimento Populacional</title>
</head>
<body>
    <h1>Crescimento Populacional</h1>
    <label for="popA">População de A:</label>
    <input type="text" id="popA"><br>
    <label for="popB">População de B:</label>
    <input type="text" id="popB"><br>
    <label for="taxaA">Taxa de crescimento de A:</label>
    <input type="text" id="taxaA"><br>
    <label for="taxaB">Taxa de crescimento de B:</label>
    <input type="text" id="taxaB"><br>
    
    <button onclick="calcular()">Calcular</button>
    <p id="resposta"></p>
    <script>
        function calcular(){
            let popA = parseFloat(document.getElementById('popA').value); // 80000;
            let popB = parseFloat(document.getElementById('popB').value); // 200000;
            let taxaA = parseFloat(document.getElementById('taxaA').value); // 0.03;
            let taxaB = parseFloat(document.getElementById('taxaB').value); // 0.015;
            let anos = 0;
            while(popA < popB){
                popA += popA * taxaA;
                popB += popB * taxaB;
                anos++;
            }
            document.getElementById('resposta').innerHTML = 
            "Levará "+anos+" anos para a população do País"+  
            " A igualar ou superar a população do País B.";
        }
    </script>
</body>
</html>
