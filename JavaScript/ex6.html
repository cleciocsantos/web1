<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 6</title>
    <style>
        table, img {
            border: solid 1px;
            padding: 10px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td><img src="crianca.jfif" alt="Pelé criança" width="200" height="200" onclick="copiarImagem(this)"></td>
            <td><img src="adulto.jfif" alt="Pelé adulto" width="200" height="200" onclick="copiarImagem(this)"></td>
            <td><img src="bola.jfif" alt="Bola de futebol" width="200" height="200" onclick="copiarImagem(this)"></td>
        </tr>
        <tr>
            <td colspan="3"><img src="crianca.jfif" alt="Imagem clicada" width="100%" height="400" id="imgGrande"></td>
        </tr>
    </table>
    <script>
        function copiarImagem(elemento){
            document.getElementById('imgGrande').src = elemento.src;
        }
    </script>
</body>
</html>
